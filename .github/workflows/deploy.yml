name: Deploy dev to GitHub Pages

# Manual-only. Run it from the Actions tab (or `gh workflow run deploy.yml --ref dev`)
# when dev is ready to go live. Merging a PR into dev does not deploy by itself;
# this button is the release step.
#
# Publishing goes through a Pages artifact instead of a deploy branch. That is
# the protection story for prod: only a workflow with pages:write can create a
# Pages deployment, so there is no branch anyone could push to by hand. The old
# `deploy` branch is retired and no longer serves anything.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to dev so the button always deploys dev, no matter which
      # branch the run was started from.
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      # Node 18 no longer builds this: undici (a transitive dependency) needs the
      # global File constructor, which only exists from Node 20 onward.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # npm ci installs the lockfile exactly and fails if it disagrees with
      # package.json, so a build can no longer change underneath us.
      # --legacy-peer-deps is required because gatsby-plugin-robots-txt declares
      # a peer range that excludes the pinned gatsby 3.15.0.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Gatsby site
        run: npm run build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
