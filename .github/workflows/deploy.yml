name: Deploy dev to GitHub Pages

# Manual-only. Run it from the Actions tab (or `gh workflow run deploy.yml`)
# when dev is ready to go live. Merging a PR into dev no longer deploys by
# itself; this button is the release step.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Pinned to dev so the button always deploys dev, no matter which
      # branch the run was started from.
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      # Node 18 no longer builds this: undici (a transitive dependency) needs the
      # global File constructor, which only exists from Node 20 onward.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # npm ci installs the lockfile exactly and fails if it disagrees with
      # package.json, so a build can no longer change underneath us.
      # --legacy-peer-deps is required because gatsby-plugin-robots-txt declares
      # a peer range that excludes the pinned gatsby 3.15.0.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Gatsby site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: deploy
